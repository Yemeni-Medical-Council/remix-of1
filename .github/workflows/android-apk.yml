name: Build Mizan Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "public/**"
      - "android/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "capacitor.config.ts"
      - "vite.config.capacitor.ts"
      - "capacitor.html"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            cmdline-tools;latest
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install required Android SDK packages
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using Android SDK root: $ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: pnpm run build:android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mizan-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
